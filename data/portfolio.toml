[[projects]]
id = "foodwaste"
img = "foodwaste.avif"
title = "FoodWaste Vision"
tag = "Computer vision"
category = "Computer Vision"
desc = "An AI-powered food analysis and calorie tracking platform that brings computer vision to everyday nutrition management. FoodWaste Vision uses deep learning models including YOLOv8-based food segmentation to identify food items from images and calculate nutritional information in real time. The platform spans mobile and web applications with a dedicated ML inference API, client-side JavaScript inference engine, and a full model training pipeline built with Jupyter Notebooks."
stack = ["YOLOv8", "Python", "OpenCV", "Edge Inference"]
metric = "98.2% mAP"

[[projects]]
id = "pokerscan"
img = "pokerscan.avif"
title = "PokerScan"
tag = "Hardware + radio"
category = "Hardware"
desc = "An Electron-based poker application with admin settings and voice-controlled interaction powered by VOSK speech recognition. Pokerscan combines a desktop client for online poker gameplay with a full admin panel for managing tables, players, and game rules. The voice recognition backend uses VOSK for offline speech-to-text, enabling hands-free commands and voice-based interaction during gameplay, while a separate voice control pipeline processes and executes recognized commands."
stack = ["ESP32", "Embedded C", "Radio ID", "WebSockets"]
metric = "<200ms scan"

[[projects]]
id = "mediroute"
img = "mediroute.avif"
title = "MediRoute"
tag = "Logistics / health"
category = "Logistics"
desc = "A medicine inventory management platform built with TypeScript, enabling patients to order prescriptions and return unused medicines through a responsive web interface. The platform handles medicine catalog management, prescription-based ordering, return processing for unused medications, and inventory tracking to ensure stock availability. Archived Python automation scripts were used for inventory synchronization, expiry date monitoring, and operational task automation."
stack = ["React Native", "GPS", "Maps SDK"]
metric = "7min avg ETA"

[[projects]]
